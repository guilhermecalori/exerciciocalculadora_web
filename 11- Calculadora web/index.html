<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web</title>
</head>

<body>
    <select id="operacao" onchange="alterarOperacao()">
        <option value="soma">Soma</option>
        <option value="subtracao">Subtração</option>
        <option value="multiplicacao">Multiplicação</option>
        <option value="divisao">Divisão</option>
    </select>

    <h2 id="titulo">Calculadora Web</h2>

    <input type="number" id="num1" placeholder="Digite o primeiro número">
    <br><br>

    <input type="number" id="num2" placeholder="Digite o segundo número">
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function somar(a, b) {
            return a + b;
        }

        function subtrair(a, b) {
            return a - b;
        }

        function multiplicar(a, b) {
            return a * b;
        }

        function dividir(a, b) {
            if (b === 0) {
                return "Erro: Divisão por zero não é permitida.";
            }
            return a / b;
        }

        function calcular() {
            let n1 = Number(document.getElementById("num1").value);
            let n2 = Number(document.getElementById("num2").value);
            let operacao = document.getElementById("operacao").value;
            let resultado;

            if (operacao === "soma") {
                resultado = somar(n1, n2);
                document.getElementById("resultado").innerText = "Resultado da soma: " + resultado;
            } else if (operacao === "subtracao") {
                resultado = subtrair(n1, n2);
                document.getElementById("resultado").innerText = "Resultado da subtração: " + resultado;
            } else if (operacao === "multiplicacao") {
                resultado = multiplicar(n1, n2);
                document.getElementById("resultado").innerText = "Resultado da multiplicação: " + resultado;
            } else if (operacao === "divisao") {
                resultado = dividir(n1, n2);
                
                document.getElementById("resultado").innerText = "Resultado da divisão: " + resultado;
            }
        }

        
    </script>
</body>
</html>
