<script>

    let nota = Number(prompt("Digite sua nota (0 a 10):"));
    if (nota >= 6) {
        alert("Aprovado!");
    };

    if (nota > 4 && nota < 6) {
        alert("Recuperação!");
    } else if (nota <= 4) {
        alert("Reprovado!");
    };

</script>
